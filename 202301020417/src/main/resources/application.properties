spring.config.import=optional:file:.env[.properties]

spring.application.name=202301020417
server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/HIS?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.liuzhen._02301020417.model

spring.jackson.time-zone=Asia/Shanghai

logging.level.com.liuzhen._02301020417=${LOG_LEVEL:info}
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000000MB

app.jwt.secret=${JWT_SECRET:his-course-design-secret-key-please-change-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.default-password=${DEFAULT_PASSWORD:123456}
app.seed-users=${SEED_USERS:true}
